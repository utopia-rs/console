[package]
name = "utopia-console"
description = "Console helpers: coloured log lines, prompts, process titles, shell-safe commands, and running commands with input, output, progress and a timeout."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
repository = "https://github.com/utopia-rs/console"

[dependencies]
php-std = { version = "0.1.0", git = "https://github.com/utopia-rs/php-std" }
serde_json = { version = "1", features = ["raw_value", "preserve_order", "float_roundtrip"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "process", "io-util", "rt"] }
utopia-validators = { version = "0.1.0", git = "https://github.com/utopia-rs/validators" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "rt", "process", "io-util"] }

[package.metadata.utopia]
php-sync = "809d2819d7da00d8b2f486e3bcb4c98a5265e950"